# Tag -> tested build -> GitHub release -> release.json.
#
# ⭑ Schwung Manager reads release.json ON THE DEFAULT BRANCH, not the GitHub
#   releases API, so the last step is not optional bookkeeping: without it the
#   catalog cannot see a new version at all.
#
# ⚠ THE DEFAULT BRANCH HERE IS `master`, not `main`. The template in the host's
#   MODULES.md says main; this repo's default is master and the catalog entry
#   declares `"default_branch": "master"`. All three have to agree.
#
# ⚠ The asset is named from the MODULE ID (`dr32-module.tar.gz`), not the repo
#   name (`schwung-dr32`). scripts/build.sh already produces exactly that file,
#   and the catalog's `asset_name` must match it byte for byte.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A tag that does not pass its own suite must not become a release.
      #
      # ⚠⚠ RUN IN debian:bookworm, NOT ON THE BARE RUNNER. The distro chooses
      #    the compiler's defaults, and two of them differ in ways that are
      #    -Werror failures rather than warnings: Ubuntu turns on
      #    _FORTIFY_SOURCE at -O2 (making `system` warn_unused_result) and
      #    Debian does not. Both of DR32's first two release attempts died here
      #    on errors no local run could produce. Pinning the image to the one
      #    scripts/Dockerfile builds from means "green locally" and "green in
      #    CI" are finally the same sentence — the command in CLAUDE.md is this
      #    command.
      #
      # ⚠ check_help SKIPS here — it measures against the HOST's font table and
      #   there is no host checkout on the runner — and a skip counts as a pass.
      #   That check is a content check; run it locally before tagging.
      - name: Test
        run: |
          docker run --rm -v "$PWD":/work -w /work debian:bookworm bash -c '
            apt-get -qq update >/dev/null && apt-get -qq install -y gcc nodejs >/dev/null
            tests/run.sh'

      # build.sh builds its own toolchain image from scripts/Dockerfile when no
      # local builder is present, and then ASSERTS the compiler out of the
      # artifact's .comment section (gcc 12.2.0, debian:bookworm). A runner that
      # somehow produced a different compiler fails here rather than shipping.
      - name: Build
        run: ./scripts/build.sh

      - name: Verify the artifact
        run: |
          set -eu
          test -f dist/dr32-module.tar.gz
          tar tzf dist/dr32-module.tar.gz
          for f in dr32/module.json dr32/dsp.so dr32/help.json; do
            tar tzf dist/dr32-module.tar.gz | grep -qx "$f" || {
              echo "ERROR: $f missing from the tarball" >&2; exit 1; }
          done
          # The tag and the shipped module.json must agree, or the catalog
          # offers an update that installs a different version than it claims.
          want="${GITHUB_REF_NAME#v}"
          got=$(node -e 'console.log(require("./src/module.json").version)')
          [ "$want" = "$got" ] || {
            echo "ERROR: tag is $GITHUB_REF_NAME but src/module.json says $got" >&2; exit 1; }

      # ⚠ THE NOTES ARE THE TAG'S OWN ANNOTATION, NOT `generate_release_notes`.
      #   That setting produces a "Full Changelog" compare link and nothing
      #   else — a reader has to go read commits to find out what changed,
      #   which is the opposite of what a release note is for. An annotated tag
      #   already carries a written summary; use it, and FAIL if it is missing
      #   rather than publishing an empty release.
      - name: Release notes from the tag
        run: |
          set -eu
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "ERROR: $GITHUB_REF_NAME has no annotation — tag with 'git tag -a' and describe the change" >&2
            exit 1
          fi
          cat /tmp/notes.md

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dr32-module.tar.gz
          body_path: /tmp/notes.md

      # ⚠⚠ IN A FRESH CLONE, NOT THIS WORKING TREE. `build/` is TRACKED and the
      #    build above runs in Docker as root, so its objects come back
      #    root-owned and `git checkout master` dies on "unable to unlink old
      #    build/obj/*.o: Permission denied" — AFTER the release has already
      #    been published, which is the worst place to fail: the release exists
      #    and the catalog still cannot see it. A separate clone cannot be
      #    poisoned by anything the build did.
      - name: Point release.json at it
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          git clone --depth 1 --branch master \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pub
          cd /tmp/pub
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cat > release.json <<EOF
          {
            "version": "${VERSION}",
            "download_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/dr32-module.tar.gz"
          }
          EOF
          git add release.json
          git commit -m "chore: release.json for ${GITHUB_REF_NAME}" || { echo "release.json already current"; exit 0; }
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
